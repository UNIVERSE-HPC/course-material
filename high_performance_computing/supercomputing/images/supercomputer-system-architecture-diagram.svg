<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" role="img" aria-label="Diagram showing a user connecting to login and service nodes, which pass work to a resource manager and scheduler, which allocates compute nodes joined by an interconnect; both login nodes and compute nodes connect to parallel storage">
  <style>
    .user { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
    .gateway { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
    .compute { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
    .storage { fill: #ecfeff; stroke: #06b6d4; stroke-width: 2; }
    .badge { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
    .line { stroke: #64748b; stroke-width: 2; fill: none; }
    .label { fill: #1e1b4b; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .badge-label { fill: #334155; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .user { fill: #78350f; stroke: #fbbf24; }
      .gateway { fill: #064e3b; stroke: #34d399; }
      .compute { fill: #1e3a5f; stroke: #60a5fa; }
      .storage { fill: #164e63; stroke: #67e8f9; }
      .badge { fill: #1e293b; stroke: #94a3b8; }
      .line { stroke: #94a3b8; }
      .label { fill: #eef2ff; }
      .badge-label { fill: #e2e8f0; }
    }
  </style>

  <!-- connecting lines -->
  <line class="line" x1="110" y1="73" x2="110" y2="115"/>
  <line class="line" x1="180" y1="155" x2="240" y2="155"/>
  <line class="line" x1="310" y1="195" x2="310" y2="240"/>
  <path class="line" d="M 330 340 L 330 380"/>
  <path class="line" d="M 180 195 L 190 390" />

  <!-- User -->
  <ellipse class="user" cx="110" cy="45" rx="70" ry="28"/>
  <text class="label" x="110" y="51">User</text>

  <!-- Login and Service Nodes -->
  <rect class="gateway" x="40" y="115" width="140" height="80" rx="10"/>
  <text class="label" x="110" y="150">Login &amp;</text>
  <text class="label" x="110" y="170">Service Nodes</text>

  <!-- Resource Manager and Scheduler -->
  <rect class="gateway" x="240" y="115" width="150" height="80" rx="10"/>
  <text class="label" x="315" y="143">Resource</text>
  <text class="label" x="315" y="163">Manager &amp;</text>
  <text class="label" x="315" y="183">Scheduler</text>

  <!-- Compute Nodes -->
  <rect class="compute" x="190" y="240" width="280" height="100" rx="12"/>
  <text class="label" x="330" y="296">Compute Nodes</text>
  <rect class="badge" x="380" y="225" width="120" height="30" rx="6"/>
  <text class="badge-label" x="440" y="245">Interconnect</text>

  <!-- Storage -->
  <rect class="storage" x="190" y="380" width="280" height="100" rx="12"/>
  <text class="label" x="330" y="436">Parallel Storage</text>
  <rect class="badge" x="275" y="345" width="120" height="30" rx="6"/>
  <text class="badge-label" x="335" y="365">Interconnect</text>
</svg>
