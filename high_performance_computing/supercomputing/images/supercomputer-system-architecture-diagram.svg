<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" width="640" height="550" role="img" aria-label="Diagram showing a user connecting to login and service nodes, which pass work to a resource manager and scheduler, which allocates several compute nodes joined by an interconnect; both login nodes and compute nodes connect to several parallel storage units">
  <style>
    .user { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
    .gateway { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
    .compute { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
    .storage { fill: #ecfeff; stroke: #06b6d4; stroke-width: 2; }
    .badge { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
    .line { stroke: #64748b; stroke-width: 2; fill: none; }
    .label { fill: #1e1b4b; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .sublabel { fill: #475569; font-family: system-ui, sans-serif; font-size: 11px; font-style: italic; text-anchor: middle; }
    .badge-label { fill: #334155; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .icon-gateway { fill: #10b981; }
    .icon-compute { fill: #3b82f6; }
    .icon-storage { fill: #06b6d4; }
    .icon-glyph { stroke: #ffffff; stroke-width: 1.5; fill: none; }
    .icon-dot { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .user { fill: #78350f; stroke: #fbbf24; }
      .gateway { fill: #064e3b; stroke: #34d399; }
      .compute { fill: #1e3a5f; stroke: #60a5fa; }
      .storage { fill: #164e63; stroke: #67e8f9; }
      .badge { fill: #1e293b; stroke: #94a3b8; }
      .line { stroke: #94a3b8; }
      .label { fill: #eef2ff; }
      .sublabel { fill: #cbd5e1; }
      .badge-label { fill: #e2e8f0; }
    }
  </style>

  <!-- connecting lines -->
  <line class="line" x1="110" y1="73" x2="110" y2="115"/>
  <line class="line" x1="190" y1="160" x2="245" y2="160"/>
  <line class="line" x1="330" y1="205" x2="330" y2="240"/>
  <line class="line" x1="330" y1="370" x2="330" y2="405"/>
  <path class="line" d="M 110 205 L 110 465 L 190 465"/>

  <!-- User -->
  <ellipse class="user" cx="110" cy="45" rx="70" ry="28"/>
  <text class="label" x="110" y="51">User</text>

  <!-- Login and Service Nodes -->
  <rect class="gateway" x="30" y="115" width="160" height="90" rx="10"/>
  <rect class="icon-gateway" x="45" y="140" width="32" height="40" rx="5"/>
  <line class="icon-glyph" x1="51" y1="152" x2="71" y2="152"/>
  <line class="icon-glyph" x1="51" y1="164" x2="71" y2="164"/>
  <circle class="icon-dot" cx="55" cy="146" r="1.6"/>
  <circle class="icon-dot" cx="55" cy="158" r="1.6"/>
  <circle class="icon-dot" cx="55" cy="170" r="1.6"/>
  <text class="label" x="133" y="152" font-size="14">Login &amp;</text>
  <text class="label" x="133" y="171" font-size="14">Service Nodes</text>

  <!-- Resource Manager and Scheduler -->
  <rect class="gateway" x="245" y="115" width="170" height="90" rx="10"/>
  <rect class="icon-gateway" x="260" y="140" width="32" height="40" rx="5"/>
  <line class="icon-glyph" x1="266" y1="152" x2="286" y2="152"/>
  <line class="icon-glyph" x1="266" y1="164" x2="286" y2="164"/>
  <circle class="icon-dot" cx="270" cy="146" r="1.6"/>
  <circle class="icon-dot" cx="270" cy="158" r="1.6"/>
  <circle class="icon-dot" cx="270" cy="170" r="1.6"/>
  <text class="label" x="353" y="143" font-size="14">Resource</text>
  <text class="label" x="353" y="161" font-size="14">Manager &amp;</text>
  <text class="label" x="353" y="179" font-size="14">Scheduler</text>

  <!-- Compute Nodes -->
  <rect class="compute" x="190" y="240" width="280" height="130" rx="12"/>
  <text class="label" x="330" y="262">Compute Nodes</text>
  <text class="sublabel" x="330" y="278">(joined by interconnect)</text>
  <rect class="icon-compute" x="210" y="290" width="44" height="50" rx="6"/>
  <rect class="icon-compute" x="308" y="290" width="44" height="50" rx="6"/>
  <rect class="icon-compute" x="406" y="290" width="44" height="50" rx="6"/>
  <g class="icon-glyph">
    <line x1="217" y1="304" x2="247" y2="304"/>
    <line x1="217" y1="315" x2="247" y2="315"/>
    <line x1="217" y1="326" x2="247" y2="326"/>
    <line x1="315" y1="304" x2="345" y2="304"/>
    <line x1="315" y1="315" x2="345" y2="315"/>
    <line x1="315" y1="326" x2="345" y2="326"/>
    <line x1="413" y1="304" x2="443" y2="304"/>
    <line x1="413" y1="315" x2="443" y2="315"/>
    <line x1="413" y1="326" x2="443" y2="326"/>
  </g>

  <!-- Interconnect between compute and storage -->
  <rect class="badge" x="270" y="374" width="120" height="26" rx="6"/>
  <text class="badge-label" x="330" y="392">Interconnect</text>

  <!-- Storage -->
  <rect class="storage" x="190" y="405" width="280" height="120" rx="12"/>
  <text class="label" x="330" y="427">Parallel Storage</text>
  <rect class="icon-storage" x="200" y="443" width="44" height="44" rx="6"/>
  <rect class="icon-storage" x="272" y="443" width="44" height="44" rx="6"/>
  <rect class="icon-storage" x="344" y="443" width="44" height="44" rx="6"/>
  <rect class="icon-storage" x="416" y="443" width="44" height="44" rx="6"/>
  <g class="icon-glyph">
    <ellipse cx="222" cy="458" rx="12" ry="4"/>
    <ellipse cx="222" cy="472" rx="12" ry="4"/>
    <line x1="210" y1="458" x2="210" y2="472"/>
    <line x1="234" y1="458" x2="234" y2="472"/>
    <ellipse cx="294" cy="458" rx="12" ry="4"/>
    <ellipse cx="294" cy="472" rx="12" ry="4"/>
    <line x1="282" y1="458" x2="282" y2="472"/>
    <line x1="306" y1="458" x2="306" y2="472"/>
    <ellipse cx="366" cy="458" rx="12" ry="4"/>
    <ellipse cx="366" cy="472" rx="12" ry="4"/>
    <line x1="354" y1="458" x2="354" y2="472"/>
    <line x1="378" y1="458" x2="378" y2="472"/>
    <ellipse cx="438" cy="458" rx="12" ry="4"/>
    <ellipse cx="438" cy="472" rx="12" ry="4"/>
    <line x1="426" y1="458" x2="426" y2="472"/>
    <line x1="450" y1="458" x2="450" y2="472"/>
  </g>
</svg>
