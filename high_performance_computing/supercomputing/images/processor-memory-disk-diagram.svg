<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" width="440" height="400" role="img" aria-label="Diagram showing a processor connected to memory, which is connected to disk">
  <style>
    .box { stroke-width: 2; }
    .box-processor { fill: #eff6ff; stroke: #3b82f6; }
    .box-memory { fill: #f5f3ff; stroke: #8b5cf6; }
    .box-disk { fill: #ecfeff; stroke: #06b6d4; }
    .icon-circle-processor { fill: #3b82f6; }
    .icon-circle-memory { fill: #8b5cf6; }
    .icon-circle-disk { fill: #06b6d4; }
    .icon-glyph { stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; }
    .label { fill: #1e1b4b; font-family: system-ui, sans-serif; font-size: 22px; font-weight: 600; }
    .line { stroke: #6366f1; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .box-processor { fill: #1e3a5f; stroke: #60a5fa; }
      .box-memory { fill: #3b1f6e; stroke: #c4b5fd; }
      .box-disk { fill: #164e63; stroke: #67e8f9; }
      .label { fill: #eef2ff; }
      .line { stroke: #a5b4fc; }
    }
  </style>

  <line class="line" x1="220" y1="110" x2="220" y2="150"/>
  <line class="line" x1="220" y1="240" x2="220" y2="280"/>

  <!-- Processor -->
  <rect class="box box-processor" x="90" y="20" width="260" height="90" rx="16"/>
  <circle class="icon-circle-processor" cx="140" cy="65" r="28"/>
  <rect class="icon-glyph" x="130" y="55" width="20" height="20" rx="2"/>
  <line class="icon-glyph" x1="140" y1="48" x2="140" y2="55"/>
  <line class="icon-glyph" x1="140" y1="75" x2="140" y2="82"/>
  <line class="icon-glyph" x1="125" y1="65" x2="130" y2="65"/>
  <line class="icon-glyph" x1="150" y1="65" x2="155" y2="65"/>
  <text class="label" x="185" y="72">Processor</text>

  <!-- Memory -->
  <rect class="box box-memory" x="90" y="150" width="260" height="90" rx="16"/>
  <circle class="icon-circle-memory" cx="140" cy="195" r="28"/>
  <rect class="icon-glyph" x="126" y="187" width="28" height="16" rx="2"/>
  <line class="icon-glyph" x1="131" y1="203" x2="131" y2="208"/>
  <line class="icon-glyph" x1="137" y1="203" x2="137" y2="208"/>
  <line class="icon-glyph" x1="143" y1="203" x2="143" y2="208"/>
  <line class="icon-glyph" x1="149" y1="203" x2="149" y2="208"/>
  <text class="label" x="185" y="202">Memory</text>

  <!-- Disk -->
  <rect class="box box-disk" x="90" y="280" width="260" height="90" rx="16"/>
  <circle class="icon-circle-disk" cx="140" cy="325" r="28"/>
  <ellipse class="icon-glyph" cx="140" cy="317" rx="13" ry="5"/>
  <ellipse class="icon-glyph" cx="140" cy="333" rx="13" ry="5"/>
  <line class="icon-glyph" x1="127" y1="317" x2="127" y2="333"/>
  <line class="icon-glyph" x1="153" y1="317" x2="153" y2="333"/>
  <text class="label" x="185" y="332">Disk</text>
</svg>
