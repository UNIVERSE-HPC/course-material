<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 570" width="480" height="570" role="img" aria-label="Diagram showing a user connected to a computer, which contains an operating system managing four CPU cores connected via a memory bus to memory">
  <style>
    .computer { fill: none; stroke: #0891b2; stroke-width: 2; }
    .user { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
    .os { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
    .core { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
    .bus { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
    .mem { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; }
    .line { stroke: #64748b; stroke-width: 2; }
    .label { fill: #1e1b4b; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; text-anchor: middle; }
    .core-label { fill: #1e1b4b; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
    .bus-label { fill: #334155; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .computer { stroke: #67e8f9; }
      .user { fill: #78350f; stroke: #fbbf24; }
      .os { fill: #164e63; stroke: #67e8f9; }
      .core { fill: #1e3a5f; stroke: #60a5fa; }
      .bus { fill: #1e293b; stroke: #94a3b8; }
      .mem { fill: #3b1f6e; stroke: #c4b5fd; }
      .line { stroke: #94a3b8; }
      .label { fill: #eef2ff; }
      .core-label { fill: #eef2ff; }
      .bus-label { fill: #e2e8f0; }
    }
  </style>

  <line class="line" x1="240" y1="63" x2="240" y2="105"/>
  <ellipse class="computer" cx="240" cy="330" rx="235" ry="215"/>

  <!-- OS fan-out to 4 cores -->
  <line class="line" x1="240" y1="197" x2="75" y2="230"/>
  <line class="line" x1="240" y1="197" x2="185" y2="230"/>
  <line class="line" x1="240" y1="197" x2="295" y2="230"/>
  <line class="line" x1="240" y1="197" x2="405" y2="230"/>

  <!-- cores to bus -->
  <line class="line" x1="75" y1="290" x2="75" y2="330"/>
  <line class="line" x1="185" y1="290" x2="185" y2="330"/>
  <line class="line" x1="295" y1="290" x2="295" y2="330"/>
  <line class="line" x1="405" y1="290" x2="405" y2="330"/>

  <!-- bus to memory -->
  <line class="line" x1="240" y1="370" x2="240" y2="410"/>

  <ellipse class="user" cx="240" cy="35" rx="75" ry="28"/>
  <text class="label" x="240" y="41">User</text>

  <ellipse class="os" cx="240" cy="165" rx="75" ry="32"/>
  <text class="label" x="240" y="160">Operating</text>
  <text class="label" x="240" y="179">System</text>

  <rect class="core" x="30" y="230" width="90" height="60" rx="10"/>
  <text class="core-label" x="75" y="255">CPU-</text>
  <text class="core-label" x="75" y="272">core</text>
  <rect class="core" x="140" y="230" width="90" height="60" rx="10"/>
  <text class="core-label" x="185" y="255">CPU-</text>
  <text class="core-label" x="185" y="272">core</text>
  <rect class="core" x="250" y="230" width="90" height="60" rx="10"/>
  <text class="core-label" x="295" y="255">CPU-</text>
  <text class="core-label" x="295" y="272">core</text>
  <rect class="core" x="360" y="230" width="90" height="60" rx="10"/>
  <text class="core-label" x="405" y="255">CPU-</text>
  <text class="core-label" x="405" y="272">core</text>

  <rect class="bus" x="30" y="330" width="420" height="40" rx="8"/>
  <text class="bus-label" x="240" y="355">Memory Bus</text>

  <rect class="mem" x="140" y="410" width="200" height="80" rx="12"/>
  <text class="label" x="240" y="455">Memory</text>
</svg>
