<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-label="Diagram showing a global grid divided into three subdomains and an enlarged view of the middle node storing its owned rows plus halo rows copied from its neighbours">
  <style>
    .panel { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
    .node1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
    .node2 { fill: #ecfeff; stroke: #06b6d4; stroke-width: 2; }
    .node3 { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; }
    .halo { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; }
    .boundary { fill: #cffafe; stroke: #06b6d4; stroke-width: 1.5; }
    .grid { stroke: #94a3b8; stroke-width: 1; fill: none; opacity: 0.7; }
    .exchange { stroke: #22c55e; stroke-width: 2.5; fill: none; }
    .arrowhead { fill: #22c55e; }
    .title { fill: #1e1b4b; font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; }
    .label { fill: #1e1b4b; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .small { fill: #475569; font-family: system-ui, sans-serif; font-size: 13px; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #1e293b; stroke: #94a3b8; stroke-width: 2; }
      .node1 { fill: #1e3a5f; stroke: #60a5fa; stroke-width: 2; }
      .node2 { fill: #164e63; stroke: #67e8f9; stroke-width: 2; }
      .node3 { fill: #3b1f6e; stroke: #c4b5fd; stroke-width: 2; }
      .halo { fill: #143d2b; stroke: #4ade80; stroke-width: 2; }
      .boundary { fill: #155e75; stroke: #67e8f9; stroke-width: 1.5; }
      .grid { stroke: #64748b; stroke-width: 1; fill: none; opacity: 0.7; }
      .exchange { stroke: #4ade80; stroke-width: 2.5; fill: none; }
      .arrowhead { fill: #4ade80; }
      .title { fill: #eef2ff; font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .label { fill: #eef2ff; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .small { fill: #cbd5e1; font-family: system-ui, sans-serif; font-size: 13px; text-anchor: middle; }
    }
  </style>

  <rect class="panel" x="20" y="25" width="375" height="380" rx="14"/>
  <text class="title" x="207.5" y="58">Global grid divided into subdomains</text>

  <!-- Three horizontal strips owned by different nodes. -->
  <rect class="node1" x="70" y="82" width="250" height="92"/>
  <rect class="node2" x="70" y="174" width="250" height="92"/>
  <rect class="node3" x="70" y="266" width="250" height="92"/>

  <!-- A lightweight grid makes the domain decomposition visible. -->
  <path class="grid" d="M95 82 V358 M120 82 V358 M145 82 V358 M170 82 V358 M195 82 V358 M220 82 V358 M245 82 V358 M270 82 V358 M295 82 V358
                         M70 105 H320 M70 128 H320 M70 151 H320 M70 197 H320 M70 220 H320 M70 243 H320 M70 289 H320 M70 312 H320 M70 335 H320"/>

  <text class="label" x="195" y="133">Node 1 subdomain</text>
  <text class="label" x="195" y="225">Node 2 subdomain</text>
  <text class="label" x="195" y="317">Node 3 subdomain</text>

  <!-- Boundary data is exchanged in both directions. -->
  <line class="exchange" x1="340" y1="148" x2="340" y2="188"/>
  <path class="arrowhead" d="M340 197 L333 182 H347 Z"/>
  <line class="exchange" x1="365" y1="200" x2="365" y2="160"/>
  <path class="arrowhead" d="M365 151 L358 166 H372 Z"/>
  <line class="exchange" x1="340" y1="240" x2="340" y2="280"/>
  <path class="arrowhead" d="M340 289 L333 274 H347 Z"/>
  <line class="exchange" x1="365" y1="292" x2="365" y2="252"/>
  <path class="arrowhead" d="M365 243 L358 258 H372 Z"/>
  <text class="small" x="350" y="218">exchange</text>
  <text class="small" x="350" y="310">exchange</text>

  <rect class="panel" x="425" y="25" width="375" height="380" rx="14"/>
  <text class="title" x="612.5" y="58">Data stored by Node 2</text>

  <!-- Node 2 stores its own subdomain and copies of neighbouring boundaries. -->
  <rect class="halo" x="485" y="82" width="255" height="48" rx="8"/>
  <text class="label" x="612.5" y="104">Halo row</text>
  <text class="small" x="612.5" y="122">copy received from Node 1</text>

  <rect class="node2" x="485" y="142" width="255" height="174" rx="8"/>
  <rect class="boundary" x="487" y="144" width="251" height="34" rx="6"/>
  <rect class="boundary" x="487" y="280" width="251" height="34" rx="6"/>
  <text class="small" x="612.5" y="165">owned boundary row</text>
  <text class="label" x="612.5" y="225">Owned subdomain</text>
  <text class="small" x="612.5" y="248">interior work may proceed</text>
  <text class="small" x="612.5" y="268">while halo data is in flight</text>
  <text class="small" x="612.5" y="302">owned boundary row</text>

  <rect class="halo" x="485" y="328" width="255" height="48" rx="8"/>
  <text class="label" x="612.5" y="350">Halo row</text>
  <text class="small" x="612.5" y="368">copy received from Node 3</text>
</svg>
