<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-label="Simplified cache hierarchy with four CPU cores, a private cache for each core, a shared last-level cache and main memory">
  <style>
    .core { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
    .private { fill: #ecfeff; stroke: #06b6d4; stroke-width: 2; }
    .shared { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; }
    .memory { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; }
    .line { stroke: #64748b; stroke-width: 2; fill: none; }
    .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; }
    .arrowhead { fill: #64748b; }
    .label { fill: #1e1b4b; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; text-anchor: middle; }
    .small { fill: #475569; font-family: system-ui, sans-serif; font-size: 13px; text-anchor: middle; }
    .scale { fill: #334155; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .core { fill: #1e3a5f; stroke: #60a5fa; stroke-width: 2; }
      .private { fill: #164e63; stroke: #67e8f9; stroke-width: 2; }
      .shared { fill: #143d2b; stroke: #4ade80; stroke-width: 2; }
      .memory { fill: #3b1f6e; stroke: #c4b5fd; stroke-width: 2; }
      .line { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .arrow { stroke: #94a3b8; stroke-width: 2.5; fill: none; }
      .arrowhead { fill: #94a3b8; }
      .label { fill: #eef2ff; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; text-anchor: middle; }
      .small { fill: #cbd5e1; font-family: system-ui, sans-serif; font-size: 13px; text-anchor: middle; }
      .scale { fill: #cbd5e1; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
    }
  </style>

  <!-- Connections are drawn behind the hierarchy. -->
  <line class="line" x1="110" y1="90" x2="110" y2="130"/>
  <line class="line" x1="290" y1="90" x2="290" y2="130"/>
  <line class="line" x1="470" y1="90" x2="470" y2="130"/>
  <line class="line" x1="650" y1="90" x2="650" y2="130"/>
  <path class="line" d="M110 195 V230 H650 V195 M290 195 V230 M470 195 V230 M380 230 V265"/>
  <line class="line" x1="380" y1="335" x2="380" y2="375"/>

  <!-- CPU cores. -->
  <rect class="core" x="40" y="25" width="140" height="65" rx="11"/>
  <text class="label" x="110" y="64">CPU-core 1</text>
  <rect class="core" x="220" y="25" width="140" height="65" rx="11"/>
  <text class="label" x="290" y="64">CPU-core 2</text>
  <rect class="core" x="400" y="25" width="140" height="65" rx="11"/>
  <text class="label" x="470" y="64">CPU-core 3</text>
  <rect class="core" x="580" y="25" width="140" height="65" rx="11"/>
  <text class="label" x="650" y="64">CPU-core 4</text>

  <!-- Cache levels closest to each core are private in this example. -->
  <rect class="private" x="40" y="130" width="140" height="65" rx="11"/>
  <text class="label" x="110" y="159">Private cache</text>
  <text class="small" x="110" y="181">smallest and fastest</text>
  <rect class="private" x="220" y="130" width="140" height="65" rx="11"/>
  <text class="label" x="290" y="159">Private cache</text>
  <text class="small" x="290" y="181">smallest and fastest</text>
  <rect class="private" x="400" y="130" width="140" height="65" rx="11"/>
  <text class="label" x="470" y="159">Private cache</text>
  <text class="small" x="470" y="181">smallest and fastest</text>
  <rect class="private" x="580" y="130" width="140" height="65" rx="11"/>
  <text class="label" x="650" y="159">Private cache</text>
  <text class="small" x="650" y="181">smallest and fastest</text>

  <!-- Later cache levels may be shared. -->
  <rect class="shared" x="155" y="265" width="450" height="70" rx="12"/>
  <text class="label" x="380" y="296">Shared last-level cache</text>
  <text class="small" x="380" y="319">larger, but farther from each CPU-core</text>

  <rect class="memory" x="230" y="375" width="300" height="70" rx="12"/>
  <text class="label" x="380" y="406">Main memory</text>
  <text class="small" x="380" y="429">much larger and slower than cache</text>

  <!-- Qualitative scale. -->
  <path class="arrow" d="M770 65 V405"/>
  <path class="arrowhead" d="M770 421 L762 402 H778 Z"/>
  <text class="scale" x="770" y="44">Closest</text>
  <text class="scale" x="770" y="452">Farther away</text>
</svg>
