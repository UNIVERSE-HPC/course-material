<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Diagram showing an SSH client on a local computer connected through an encrypted network connection to a remote shell on an HPC login node">
  <style>
    .local { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
    .system { fill: none; stroke: #0891b2; stroke-width: 2; }
    .login { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
    .terminal { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
    .badge { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
    .line { stroke: #6366f1; stroke-width: 2.5; fill: none; }
    .arrow-head { fill: #6366f1; }
    .label { fill: #1e1b4b; font-family: system-ui, sans-serif; font-size: 18px; font-weight: 600; text-anchor: middle; }
    .terminal-label { fill: #334155; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
    .command { fill: #475569; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 14px; text-anchor: start; }
    .connection-label { fill: #4c1d95; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
    .sublabel { fill: #475569; font-family: system-ui, sans-serif; font-size: 13px; font-style: italic; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .local { fill: #78350f; stroke: #fbbf24; }
      .system { stroke: #67e8f9; }
      .login { fill: #064e3b; stroke: #34d399; }
      .terminal { fill: #1e293b; stroke: #94a3b8; }
      .badge { fill: #3b1f6e; stroke: #c4b5fd; }
      .line { stroke: #a5b4fc; }
      .arrow-head { fill: #a5b4fc; }
      .label { fill: #eef2ff; }
      .terminal-label { fill: #e2e8f0; }
      .command { fill: #cbd5e1; }
      .connection-label { fill: #ede9fe; }
      .sublabel { fill: #cbd5e1; }
    }
  </style>

  <!-- Local computer -->
  <rect class="local" x="35" y="55" width="250" height="250" rx="18"/>
  <text class="label" x="160" y="91">Local computer</text>
  <rect class="terminal" x="65" y="120" width="190" height="120" rx="10"/>
  <text class="terminal-label" x="160" y="151">SSH client</text>
  <text class="command" x="84" y="185">local$</text>
  <text class="command" x="84" y="211">ssh username@…</text>

  <!-- Remote HPC system -->
  <rect class="system" x="475" y="35" width="250" height="290" rx="20"/>
  <text class="label" x="600" y="72">HPC system</text>
  <rect class="login" x="505" y="105" width="190" height="160" rx="14"/>
  <text class="label" x="600" y="139">Login node</text>
  <rect class="terminal" x="535" y="163" width="130" height="65" rx="9"/>
  <text class="terminal-label" x="600" y="188">Remote shell</text>
  <text class="command" x="551" y="212">remote$</text>

  <!-- Encrypted connection -->
  <line class="line" x1="290" y1="191" x2="470" y2="191"/>
  <path class="arrow-head" d="M 285 191 L 297 184 L 297 198 z"/>
  <path class="arrow-head" d="M 475 191 L 463 184 L 463 198 z"/>
  <rect class="badge" x="305" y="133" width="150" height="34" rx="8"/>
  <text class="connection-label" x="380" y="155">Encrypted SSH</text>
  <text class="sublabel" x="380" y="224">commands and output</text>
</svg>
