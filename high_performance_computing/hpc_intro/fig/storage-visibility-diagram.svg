<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="Diagram showing a login node and two compute nodes connected to a shared filesystem, with each compute node also containing separate node-local temporary storage">
  <style>
    .login { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
    .compute { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
    .local { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
    .storage { fill: #ecfeff; stroke: #06b6d4; stroke-width: 2; }
    .line { stroke: #64748b; stroke-width: 2.5; fill: none; }
    .label { fill: #1e1b4b; font-family: system-ui, sans-serif; font-size: 18px; font-weight: 600; text-anchor: middle; }
    .sublabel { fill: #475569; font-family: system-ui, sans-serif; font-size: 13px; text-anchor: middle; }
    .badge-label { fill: #334155; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .icon-login { fill: #10b981; }
    .icon-compute { fill: #3b82f6; }
    .icon-storage { fill: #06b6d4; }
    .icon-glyph { stroke: #ffffff; stroke-width: 1.7; fill: none; stroke-linecap: round; }
    .icon-dot { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .login { fill: #064e3b; stroke: #34d399; }
      .compute { fill: #1e3a5f; stroke: #60a5fa; }
      .local { fill: #3b1f6e; stroke: #c4b5fd; }
      .storage { fill: #164e63; stroke: #67e8f9; }
      .line { stroke: #94a3b8; }
      .label { fill: #eef2ff; }
      .sublabel { fill: #cbd5e1; }
      .badge-label { fill: #e2e8f0; }
    }
  </style>

  <!-- Connections to shared storage -->
  <path class="line" d="M 130 175 L 130 250 L 225 250 L 225 330"/>
  <path class="line" d="M 380 210 L 380 330"/>
  <path class="line" d="M 630 210 L 630 250 L 535 250 L 535 330"/>

  <!-- Login node -->
  <rect class="login" x="35" y="45" width="190" height="130" rx="14"/>
  <rect class="icon-login" x="60" y="80" width="42" height="54" rx="6"/>
  <line class="icon-glyph" x1="68" y1="95" x2="94" y2="95"/>
  <line class="icon-glyph" x1="68" y1="109" x2="94" y2="109"/>
  <line class="icon-glyph" x1="68" y1="123" x2="94" y2="123"/>
  <circle class="icon-dot" cx="72" cy="88" r="1.8"/>
  <circle class="icon-dot" cx="72" cy="102" r="1.8"/>
  <circle class="icon-dot" cx="72" cy="116" r="1.8"/>
  <text class="label" x="157" y="103">Login node</text>
  <text class="sublabel" x="157" y="126">interactive access</text>

  <!-- Compute node 1 -->
  <rect class="compute" x="285" y="30" width="190" height="180" rx="14"/>
  <rect class="icon-compute" x="310" y="57" width="42" height="54" rx="6"/>
  <line class="icon-glyph" x1="318" y1="72" x2="344" y2="72"/>
  <line class="icon-glyph" x1="318" y1="86" x2="344" y2="86"/>
  <line class="icon-glyph" x1="318" y1="100" x2="344" y2="100"/>
  <circle class="icon-dot" cx="322" cy="65" r="1.8"/>
  <circle class="icon-dot" cx="322" cy="79" r="1.8"/>
  <circle class="icon-dot" cx="322" cy="93" r="1.8"/>
  <text class="label" x="413" y="81">Compute</text>
  <text class="label" x="413" y="103">node 1</text>
  <rect class="local" x="310" y="130" width="140" height="55" rx="9"/>
  <text class="badge-label" x="380" y="153">Node-local</text>
  <text class="sublabel" x="380" y="171">temporary storage</text>

  <!-- Compute node 2 -->
  <rect class="compute" x="535" y="30" width="190" height="180" rx="14"/>
  <rect class="icon-compute" x="560" y="57" width="42" height="54" rx="6"/>
  <line class="icon-glyph" x1="568" y1="72" x2="594" y2="72"/>
  <line class="icon-glyph" x1="568" y1="86" x2="594" y2="86"/>
  <line class="icon-glyph" x1="568" y1="100" x2="594" y2="100"/>
  <circle class="icon-dot" cx="572" cy="65" r="1.8"/>
  <circle class="icon-dot" cx="572" cy="79" r="1.8"/>
  <circle class="icon-dot" cx="572" cy="93" r="1.8"/>
  <text class="label" x="663" y="81">Compute</text>
  <text class="label" x="663" y="103">node 2</text>
  <rect class="local" x="560" y="130" width="140" height="55" rx="9"/>
  <text class="badge-label" x="630" y="153">Node-local</text>
  <text class="sublabel" x="630" y="171">temporary storage</text>

  <!-- Shared filesystem -->
  <rect class="storage" x="105" y="330" width="550" height="130" rx="16"/>
  <rect class="icon-storage" x="145" y="365" width="58" height="58" rx="8"/>
  <ellipse class="icon-glyph" cx="174" cy="382" rx="17" ry="6"/>
  <ellipse class="icon-glyph" cx="174" cy="406" rx="17" ry="6"/>
  <line class="icon-glyph" x1="157" y1="382" x2="157" y2="406"/>
  <line class="icon-glyph" x1="191" y1="382" x2="191" y2="406"/>
  <text class="label" x="420" y="384">Shared filesystem</text>
  <text class="sublabel" x="420" y="410">the same files are visible from connected nodes</text>
</svg>
