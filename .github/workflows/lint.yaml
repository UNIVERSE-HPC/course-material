name: Lint markdown files

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/lint.yaml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/lint.yaml"

jobs:
  check-markdown-yaml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Front Matter Linting
        uses: alasdairwilson/front-matter-lint@main
        with:
          directory: "."

      - name: Validate Gutenberg material schema
        uses: alasdairwilson/course-material-front-matter@main
        with:
          directory: "."

  lint-python-codeblocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint Python Code Blocks in Markdown
        uses: OxfordRSE/lint-md-codeblocks@main
        with:
          directory: "."
          language: "python"

  check-ascii-codeblocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check code blocks for non-ASCII characters
        run: python3 .github/scripts/check_ascii_codeblocks.py

  lint-markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint Markdown files
        run: markdownlint '**/*.md' --ignore '*/*/slides/*' --ignore README.md
